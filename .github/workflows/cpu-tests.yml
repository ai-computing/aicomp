name: cpu-tests

on:
  push:
    branches: [optimus-rm]
  pull_request:
    branches: [optimus-rm]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "opt_prime[test]" "transformers==5.1.0" triton
      - name: opt_prime tests
        working-directory: opt_prime
        run: python -m pytest -q tests
      - name: native_kv tests
        run: python -m unittest discover -s opt_prime/examples/pd/native_kv -p 'test_*.py'
